<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#16181d; --sub:#6b7280; --line:#e3e5ea; --brand:#1e3a8a; --brand-fg:#fff;
  --field-bg:#dbe7ff; --field-fg:#1d3fae; --leave-bg:#d8f3df; --leave-fg:#12692f;
  --deadline-bg:#ffdcdc; --deadline-fg:#b01919; --dept-bg:#eadcff; --dept-fg:#5b21b6;
  --sun:#d92c2c; --sat:#2456d6; --sel:#eef2ff; --today:#1e3a8a; --today-bg:#fff7db;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115; --card:#1a1d24; --text:#eceef2; --sub:#9aa1ad; --line:#2b2f39; --brand:#16234d; --brand-fg:#fff;
  --field-bg:#1c2f66; --field-fg:#c3d4ff; --leave-bg:#143d22; --leave-fg:#b4ecc4;
  --deadline-bg:#551a1a; --deadline-fg:#ffc4c4; --dept-bg:#3a2466; --dept-fg:#dccbff;
  --sun:#ff7a7a; --sat:#8fb0ff; --sel:#232a40; --today:#ffd15c; --today-bg:#3a3111;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior-x:none}   /* 좌우로 밀 때 브라우저의 "뒤로 가기" 제스처가 대신 먹지 않게 */
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-fg);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
header.busy::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:32%;background:#ffd15c;border-radius:2px;animation:slide .9s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){header.busy::after{animation:none;width:100%;opacity:.6}}
.grid.inL{animation:inL .18s ease-out}.grid.inR{animation:inR .18s ease-out}
@keyframes inL{from{transform:translateX(28px);opacity:.3}}@keyframes inR{from{transform:translateX(-28px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.grid.inL,.grid.inR{animation:none}}
.hrow{display:flex;align-items:center;gap:8px}
.hrow h1{font-size:17px;margin:0;flex:1;font-weight:700}
.upd{color:inherit;background:rgba(255,255,255,.14);border-radius:8px;height:32px;padding:0 11px;font-size:13px;white-space:nowrap}
.upd:disabled{opacity:.5}
.nav{display:flex;align-items:center;gap:4px;margin-top:8px}
.nav .label{flex:1;font-size:19px;font-weight:700}
.nav button{color:inherit;min-width:40px;height:36px;border-radius:8px;background:rgba(255,255,255,.14);font-size:15px;padding:0 10px}
.demo{background:#fde68a;color:#5b4300;font-size:12.5px;padding:6px 14px;text-align:center}
main{flex:1;padding:10px 10px 96px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--sub)}
.fchip.on{color:var(--text);border-color:var(--text);font-weight:600}
.fchip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--cd,var(--cf))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:hidden}
.dow{font-size:12px;text-align:center;padding:6px 0;color:var(--sub);border-bottom:1px solid var(--line)}
.cell{min-height:78px;padding:3px 2px 4px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;min-width:0;overflow:hidden}
.cell:nth-child(7n){border-right:0}
.cell.out .num{opacity:.35}
.cell.sel{background:var(--sel)}
.num{align-self:flex-start;display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;font-size:12.5px;border-radius:11px;margin-bottom:1px}
.today .num{background:var(--today);color:#fff;font-weight:700}
.cell.today{background:var(--today-bg);box-shadow:inset 0 0 0 2.5px var(--today);border-radius:6px;position:relative;z-index:1}
.cell.today.sel{background:var(--today-bg)}
.todaytag{font-size:10px;font-weight:700;color:var(--today);margin-left:2px;vertical-align:1px}
.numrow{display:flex;align-items:center}
@media (prefers-color-scheme:dark){.today .num{color:#1a1400}}
.sun{color:var(--sun)} .sat{color:var(--sat)}
.chip{display:block;font-size:10.5px;line-height:1.35;border-radius:4px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.chip b,.chip u{display:block;white-space:nowrap;overflow:hidden;text-decoration:none}
.chip b{font-weight:700;white-space:normal;word-break:break-all;line-height:1.25;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.team .chip b,.team .chip u{white-space:normal}
.more{font-size:10.5px;color:var(--sub);padding-left:3px;margin-top:1px;display:block}
.t-field{background:var(--field-bg);color:var(--field-fg)} .t-leave{background:var(--leave-bg);color:var(--leave-fg)}
.t-deadline{background:var(--deadline-bg);color:var(--deadline-fg)} .t-dept{background:var(--dept-bg);color:var(--dept-fg)}
.c-blue{--cb:#dbe7ff;--cf:#1d3fae}.c-green{--cb:#d8f3df;--cf:#12692f}.c-red{--cb:#ffdcdc;--cf:#b01919}.c-purple{--cb:#eadcff;--cf:#5b21b6}
.c-orange{--cb:#ffe6cc;--cf:#a34a00}.c-teal{--cb:#cdf3f0;--cf:#0b6b66}.c-pink{--cb:#ffdcee;--cf:#a8246b}.c-gray{--cb:#e6e8ec;--cf:#444b57}
@media (prefers-color-scheme:dark){
.c-blue{--cb:#1c2f66;--cf:#c3d4ff}.c-green{--cb:#143d22;--cf:#b4ecc4}.c-red{--cb:#551a1a;--cf:#ffc4c4}.c-purple{--cb:#3a2466;--cf:#dccbff}
.c-orange{--cb:#55310c;--cf:#ffd3a3}.c-teal{--cb:#0f4744;--cf:#a8ebe6}.c-pink{--cb:#57183a;--cf:#ffc4e0}.c-gray{--cb:#30343c;--cf:#d3d7de}}
[class*="c-"].fill{background:var(--cb);color:var(--cf)}
.item .bar[class*="c-"]{background:var(--cd,var(--cf))}
i.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cd,var(--cf));margin-right:6px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:3px 0 2px}.tags .badge{margin-left:0}
.badge.kb{margin:0 7px 0 0;font-size:12.5px;padding:2px 7px;vertical-align:1px}
.dtitle .badge.kb{font-size:15px;padding:3px 9px;vertical-align:3px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:36px;height:36px;border-radius:18px;background:var(--cb);border:2px solid transparent;color:var(--cf);font-weight:700}
.sw button.on{outline:3px solid var(--text);outline-offset:2px}
.sw.many{gap:9px}.sw.many button{width:31px;height:31px;font-size:13px}
.swlab{font-size:12px;color:var(--sub);margin:10px 0 6px}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14.5px;color:var(--text)}.chk input{width:20px;height:20px;margin:0}
.ord{flex:none;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;color:var(--sub)}.ord:disabled{opacity:.3}
h2{font-size:15px;margin:16px 4px 8px}
.list{overflow:hidden}
.item{display:flex;gap:10px;align-items:stretch;width:100%;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .bar{width:5px;border-radius:3px;flex:none}
.item .tt{font-weight:600;word-break:break-all}
.item .ss{font-size:12.5px;color:var(--sub)}
.empty{padding:22px 12px;text-align:center;color:var(--sub);font-size:13.5px}
.twrap{overflow-x:auto}
table.team{border-collapse:collapse;width:100%;min-width:600px;table-layout:fixed}
.team th.sat,.team th.sun{width:48px}
.team th,.team td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px;vertical-align:top;font-size:12px}
.team th{font-weight:600;color:var(--sub);text-align:center;padding:7px 2px}
.team th.tod{color:var(--text);background:var(--sel)}
.team td.tod{background:var(--sel)}
.team .who{position:sticky;left:0;background:var(--card);width:74px;z-index:1;font-weight:600;font-size:12.5px;word-break:keep-all}
.team .who small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.team td{height:46px}
.team td.mine{cursor:pointer}
.team .chip{font-size:11.5px;white-space:normal;word-break:break-all;padding:2px 4px;width:100%;text-align:left}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:760px;margin:0 auto;display:flex}
.tabs button{flex:1;padding:9px 0 8px;font-size:12px;color:var(--sub)}
.tabs button b{display:block;font-size:19px;line-height:1.2;font-weight:400}
.tabs button.on{color:var(--text);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(env(safe-area-inset-bottom) + 72px);z-index:6;width:54px;height:54px;border-radius:27px;background:var(--brand);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:760px;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto}
.sheet h3{margin:0 0 12px;font-size:17px}
.ov.full{align-items:stretch;background:var(--bg)}
.ov.full .sheet{background:var(--bg);max-width:760px;width:100%;height:100%;max-height:none;border-radius:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 16px)}
.dtop{flex:none;margin-bottom:8px}.dtop .btn{font-size:14.5px;padding:8px 14px}
.dbody{flex:1;overflow-y:auto;padding-bottom:12px}
.dtitle{font-size:24px;line-height:1.3;margin:8px 0 4px;word-break:break-all}
.dsec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:12px}
.dlab{font-size:12.5px;color:var(--sub);margin-bottom:5px}
.dbig{font-size:19px;font-weight:700}
.dwho{display:flex;flex-wrap:wrap;gap:7px}
.person{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:600;background:var(--bg)}.person small{font-weight:400;color:var(--sub);margin-left:6px;font-size:12px}
.dfoot{flex:none;margin-top:10px}.dfoot .btn{padding:14px}
.ov.mid{align-items:center;padding:16px}
.ov.mid .sheet{border-radius:16px;max-width:520px;max-height:82vh;padding-bottom:18px}
label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 11px;font-size:16px;min-height:44px}
textarea{min-height:72px;resize:vertical}
select.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 11px;font-size:16px;min-height:44px;color:var(--text)}
.fsel{flex:none;border:1px solid var(--text);background:var(--card);border-radius:999px;padding:5px 8px;font-size:13px;color:var(--text);max-width:140px;font-weight:600}
.mode{display:flex;gap:6px;margin:0 2px 10px}.mode button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px;font-size:13.5px;color:var(--sub)}
.mode button.on{border-color:var(--text);color:var(--text);font-weight:700}
.team .who.k{cursor:pointer;word-break:break-all;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
button.person{cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 0 22%;border:1px solid var(--line);border-radius:9px;padding:9px 6px;font-size:13px;white-space:nowrap}
.seg button.on{border-color:transparent;font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>div{min-width:0}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.btns{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;border-radius:10px;padding:12px;font-weight:700;background:var(--brand);color:#fff;text-align:center}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.danger{background:none;border:1px solid var(--deadline-fg);color:var(--deadline-fg);flex:none;padding:12px 16px}
.btn.sm{flex:none;padding:6px 12px;font-size:13px}
.kv{font-size:14px;margin:6px 0}.kv span{color:var(--sub);display:inline-block;width:52px}
.memo{white-space:pre-wrap;word-break:break-all;background:var(--bg);border-radius:9px;padding:10px;font-size:14px;margin-top:8px}
.badge{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:600}
.auth{padding:40px 22px;max-width:420px;margin:0 auto;width:100%}
.auth h1{font-size:24px;margin:0 0 4px}.auth p{color:var(--sub);margin:0 0 18px}
.link{color:var(--sat);text-decoration:underline;font-size:14px;margin-top:16px;display:inline-block}
.pad{padding:12px 14px}
.help{font-size:13px;color:var(--sub);line-height:1.6}
.install{background:var(--sel);border-bottom:1px solid var(--line);padding:10px 12px 10px 14px;font-size:13.5px;line-height:1.5;display:flex;gap:10px;align-items:center}
.install>div{flex:1}.install .x{font-size:22px;color:var(--sub);padding:0 6px}.install .btn{margin-top:6px;display:inline-block}
.keep{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14.5px;color:var(--text)}.keep input{width:20px;height:20px;margin:0}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px}
.pick button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pick button.all{border-style:dashed;color:var(--sub)}
.roles{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.roles>div{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border-bottom:1px solid var(--line)}.roles>div:last-child{border-bottom:0}
.roles span{flex:1;font-size:14.5px;font-weight:600;min-width:0}
.roles select{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:14.5px;color:var(--text);min-height:36px}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);z-index:20;background:#111;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;max-width:86%;display:none}
/* ===== 겉모습 2: iOS 캘린더풍 (흰 바탕 · 빨간 강조색 · 가는 구분선 · 큰 제목). 기능은 그대로, 위 규칙을 덮어씀 ===== */
:root{
  --bg:#f2f2f7; --card:#fff; --text:#000; --sub:#8a8a8e; --line:#d8d8dc; --brand:#ff3b30; --brand-fg:#fff; --fillc:rgba(118,118,128,.12);
  --deadline-fg:#ff3b30; --sun:#8a8a8e; --sat:#8a8a8e; --sel:rgba(255,59,48,.07); --today:#ff3b30; --today-bg:transparent;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --card:#1c1c1e; --text:#fff; --sub:#98989f; --line:#38383a; --brand:#ff453a; --fillc:rgba(118,118,128,.24);
  --deadline-fg:#ff453a; --sun:#98989f; --sat:#98989f; --sel:rgba(255,69,58,.14); --today:#ff453a;
}}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.c-blue{--cb:#d6e8ff;--cf:#0058c4;--cd:#007aff}.c-green{--cb:#d4f3dc;--cf:#1a7f37;--cd:#34c759}.c-red{--cb:#ffdad7;--cf:#c4221a;--cd:#ff3b30}.c-purple{--cb:#f0dcfa;--cf:#8327b5;--cd:#af52de}
.c-orange{--cb:#ffe8c7;--cf:#a85a00;--cd:#ff9500}.c-teal{--cb:#cfeff5;--cf:#0a6f84;--cd:#30b0c7}.c-pink{--cb:#ffd9e2;--cf:#c2184a;--cd:#ff2d55}.c-gray{--cb:#e5e5ea;--cf:#48484a;--cd:#8e8e93}
@media (prefers-color-scheme:dark){
.c-blue{--cb:#0a2a52;--cf:#7ab8ff;--cd:#0a84ff}.c-green{--cb:#0f3d1c;--cf:#7ee29a;--cd:#30d158}.c-red{--cb:#4d1512;--cf:#ff8f88;--cd:#ff453a}.c-purple{--cb:#3a1a4d;--cf:#d9a3f5;--cd:#bf5af2}
.c-orange{--cb:#4d2d00;--cf:#ffc266;--cd:#ff9f0a}.c-teal{--cb:#0c3a44;--cf:#7fd7e8;--cd:#40c8e0}.c-pink{--cb:#4d0f1e;--cf:#ff8fa8;--cd:#ff375f}.c-gray{--cb:#2c2c2e;--cf:#d1d1d6;--cd:#8e8e93}
.today .num{color:#fff}.mode button.on{background:#636366}}
/* 위쪽 바: 반투명 흰색, 작은 빨간 글자 버튼, 큰 월 제목 */
header{background:var(--card);background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--text);border-bottom:.5px solid var(--line);padding:calc(env(safe-area-inset-top) + 6px) 16px 8px}
header.busy::after{height:2px;background:var(--brand)}
.hrow{gap:2px}.hrow h1{font-size:15px;font-weight:600;color:var(--brand)}
.upd{background:none;color:var(--brand);font-size:15px;height:34px;padding:0 8px;border-radius:8px}
.fab{position:static;flex:none;width:34px;height:34px;border-radius:8px;background:none;color:var(--brand);font-size:31px;font-weight:300;line-height:30px;box-shadow:none;margin-right:-6px}
.nav{margin-top:0;gap:0}.nav .label{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.nav button{background:none;color:var(--brand);font-size:17px;min-width:36px;height:38px;padding:0 6px}
.nav.wk .label{font-size:22px}
.nav button[aria-label]{font-size:32px;font-weight:300;line-height:30px;padding-bottom:5px;min-width:34px}
.upd:active,.fab:active,.nav button:active,.fchip:active,.tabs button:active{opacity:.45}
main{padding:10px 16px 96px}
h2{font-size:13px;font-weight:400;color:var(--sub);margin:22px 14px 7px}
.card{border:0;border-radius:12px}
/* 달력: 가장자리까지 흰 판, 가로 실선만, 오늘은 빨간 동그라미 */

<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="config.js" onerror="void 0"></script>
<script>
(() => {
'use strict';
const CFG = window.APP_CONFIG || {};
const DEMO = !(CFG.SUPABASE_URL && CFG.SUPABASE_KEY);
const APP_VERSION = '2026-11-28.4.45';   // 날짜.그날 몇 번째 배포.처음부터 누적 배포 횟수 — version.json 과 함께 올림 → 열려 있는 앱이 스스로 새로고침
const HASH0 = location.hash;   // 비밀번호 재설정 링크로 들어왔는지 판별용
const DEPT = CFG.DEPT_NAME || '84부';

/* ---------- 공통 도구 ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const md = s => { const d = parse(s); return `${d.getMonth() + 1}.${d.getDate()}(${DOW[d.getDay()]})`; };
const dayCount = (a, b) => Math.round((parse(b) - parse(a)) / 86400000) + 1;
const range = (a, b) => a === b ? md(a) : `${md(a)} – ${md(b)} · ${dayCount(a, b)}일`;
const mondayOf = s => { const d = parse(s); return addDays(s, -((d.getDay() + 6) % 7)); };

// 일정 유형(카테고리): 관리자가 [설정]에서 추가·수정. 아래는 서버에 목록이 없을 때 쓰는 기본값.
const DEFAULT_CATS = [
  { id: 'field', label: '필드·감사', color: 'blue', shared: false, active: true, sort: 10 },
  { id: 'leave', label: '휴가·교육', color: 'green', shared: false, active: true, sort: 20 },
  { id: 'deadline', label: '마감·기한', color: 'red', shared: false, active: true, sort: 30 },
  { id: 'dept', label: '부서 행사', color: 'purple', shared: true, active: true, sort: 40 },
];
const COLORS = ['blue', 'green', 'red', 'purple', 'orange', 'teal', 'pink', 'gray'];
// 배정할 때 사람별로 고르는 역할(그 일정에서의 역할). 위에서부터 직급 순서이며, 상세 화면도 이 순서로 정렬.
const ROLES = ['매니저', '인차지', '시니어', '스탭'];
const roleRank = r => { const i = ROLES.indexOf(r); return i < 0 ? ROLES.length : i; };
const HINTS = {   // 기본 유형에만 있는 입력 도우미
  field: { ph: '예: A사 기말감사' }, deadline: { ph: '예: A사 감사보고서 발행' }, dept: { ph: '예: 부서 회의' },
  leave: { ph: '예: 연차', quick: ['연차', '오전 반차', '오후 반차', '교육', '기타 부재'] },
};
let CATS = [], CMAP = {};
function setCats(rows) {
  CATS = [...(rows && rows.length ? rows : DEFAULT_CATS)].sort((a, b) => a.sort - b.sort || a.label.localeCompare(b.label, 'ko'));
  CMAP = Object.fromEntries(CATS.map(c => [c.id, c]));
}
setCats(DEFAULT_CATS);
const cat = id => CMAP[id] || { id, label: '기타', color: 'gray', shared: false, active: false, sort: 999 };
const cc = id => 'fill c-' + cat(id).color;
// 거래처: 관리자가 [설정]에서 등록. 일정마다 하나를 지정할 수 있음(선택).
let CLIENTS = [], KMAP = {};
function setClients(rows) {
  CLIENTS = [...(Array.isArray(rows) ? rows : [])].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  KMAP = Object.fromEntries(CLIENTS.map(c => [c.id, c]));
}
const cli = id => (id && KMAP[id]) || null;

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
// 거래처용 넓은 팔레트: 색상각 18가지 × (연한 색 h / 진한 색 s) + 회색 = 37가지. CSS 는 여기서 만들어 붙임.
const HUES = [0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200, 220, 240, 260, 280, 300, 320, 340];
const KCOLORS = [...HUES.map(x => 'h' + x), ...HUES.map(x => 's' + x), 'gray'];
document.head.append(h('style', {},
  HUES.map(x => `.c-h${x}{--cb:hsl(${x} 85% 90%);--cf:hsl(${x} 75% 26%);--cd:hsl(${x} 70% 42%)}.c-s${x}{--cb:hsl(${x} 62% 40%);--cf:#fff;--cd:hsl(${x} 62% 40%)}`).join('') +
  '@media (prefers-color-scheme:dark){' + HUES.map(x => `.c-h${x}{--cb:hsl(${x} 42% 23%);--cf:hsl(${x} 85% 84%);--cd:hsl(${x} 70% 62%)}.c-s${x}{--cb:hsl(${x} 58% 46%);--cf:#fff;--cd:hsl(${x} 58% 54%)}`).join('') + '}'));
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 3200);
}
function errText(e) {
  const m = (e && e.message) || String(e);
  if (/Invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 맞지 않습니다.';
  if (/already registered/i.test(m)) return '이미 가입된 이메일입니다. 로그인해 주세요.';
  if (/Email not confirmed/i.test(m)) return '가입 확인 메일의 링크를 먼저 눌러 주세요.';
  if (/Password should be/i.test(m)) return '비밀번호는 6자 이상으로 입력해 주세요.';
  if (/different from the old password/i.test(m)) return '이전과 다른 비밀번호를 입력해 주세요.';
  if (/not authorized/i.test(m)) return '메일 발송 설정이 아직 완료되지 않았습니다. 관리자에게 문의해 주세요.';
  if (/rate limit|security purposes/i.test(m)) return '요청이 너무 잦습니다. 1~2분 뒤 다시 시도해 주세요.';
  if (/foreign key constraint/i.test(m)) return '이미 일정에 쓰이고 있어 삭제할 수 없습니다. 대신 "숨기기"를 사용해 주세요.';
  if (/duplicate key/i.test(m)) return '같은 이름이 이미 등록되어 있습니다.';
  if (/row-level security|permission denied/i.test(m)) return '권한이 없습니다. (본인 일정만 수정할 수 있습니다)';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '네트워크 연결을 확인해 주세요.';
  return '오류: ' + m;
}

/* ---------- 로그인 상태 유지 선택 ---------- */
// 유지 선택 시: 기기에 계속 저장(localStorage) / 해제 시: 앱·탭을 닫으면 로그아웃(sessionStorage)
const REMEMBER_KEY = 'sched84-remember';
const box = pick => ({
  get: k => { try { return pick().getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { pick().setItem(k, v); } catch (e) { /* 무시 */ } },
  del: k => { try { pick().removeItem(k); } catch (e) { /* 무시 */ } },
});
const LS = box(() => localStorage), SS = box(() => sessionStorage);
const remembered = () => LS.get(REMEMBER_KEY) !== '0';
const setRemember = v => LS.set(REMEMBER_KEY, v ? '1' : '0');
const authStorage = {
  getItem: k => { const v = LS.get(k); return v != null ? v : SS.get(k); },
  setItem: (k, v) => { if (remembered()) { LS.set(k, v); SS.del(k); } else { SS.set(k, v); LS.del(k); } },
  removeItem: k => { LS.del(k); SS.del(k); },
};

/* ---------- 저장소: 실제 서버(Supabase) ---------- */
function supaStore(sb) {
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  const cols = 'id,owner_id,type,title,start_date,end_date,memo,client_id,source,event_members(user_id,role,start_date,end_date)';
  const norm = rows => rows.map(({ event_members, ...e }) => ({ ...e, members: (event_members || []).map(m => m.user_id), roles: Object.fromEntries((event_members || []).filter(m => m.role).map(m => [m.user_id, m.role])),
    spans: Object.fromEntries((event_members || []).filter(m => m.start_date || m.end_date).map(m => [m.user_id, [m.start_date, m.end_date]])) }));   // spans: 일정 전체 기간과 다르게 투입되는 사람만
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
    async signIn(email, password) { ok(await sb.auth.signInWithPassword({ email, password })); },
    async signUp(email, password, name) { const d = ok(await sb.auth.signUp({ email, password, options: { data: { name } } })); return !!d.session; },
    async signOut() { await sb.auth.signOut(); },
    async resetRequest(email) { ok(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname.replace(/index\.html$/, '') })); },
    async setPassword(pw) { ok(await sb.auth.updateUser({ password: pw })); },
    async profiles() {
      const r = await sb.from('profiles').select('id,name,title,approved,is_admin,left_at,sort,pending,hidden').order('name');
      return r.error ? ok(await sb.from('profiles').select('id,name,title,approved,is_admin,left_at').order('name')) : r.data;   // 순서 칸(v7)이 아직 없는 서버에서도 동작
    },
    // 이름만 먼저 등록해 둔 자리(pending)의 일정을 실제 가입 계정으로 넘김
    // 퇴사자를 설정 목록에서 지움(줄은 남겨서 과거 일정의 이름은 유지)
    async hideLeaver(id) { const d = ok(await sb.from('profiles').update({ hidden: true }).eq('id', id).select('id,hidden')); if (!d || !d.length || !d[0].hidden) throw new Error('permission denied'); },
    async linkMember(from, to) { const r = await sb.rpc('link_member', { p_from: from, p_to: to }); if (r.error) throw r.error; },
    async setOrder(list) { await Promise.all(list.map(async ([id, sort]) => { const d = ok(await sb.from('profiles').update({ sort }).eq('id', id).select('id,sort')); if (!d || !d.length || d[0].sort !== sort) throw new Error('permission denied'); })); },
    async clients() { return ok(await sb.from('clients').select('id,name,color,active').order('name')); },
    async saveClient(c) {
      const row = { name: c.name, color: c.color, active: c.active };
      const d = c.id ? ok(await sb.from('clients').update(row).eq('id', c.id).select('id')) : ok(await sb.from('clients').insert(row).select('id'));
      if (!d || !d.length) throw new Error('permission denied');
    },
    async deleteClient(id) { const d = ok(await sb.from('clients').delete().eq('id', id).select('id')); if (!d.length) throw new Error('permission denied'); },
    async clientEvents(id) { return norm(ok(await sb.from('events').select(cols).eq('client_id', id).is('deleted_at', null).order('start_date', { ascending: false }).limit(300))); },
    // 퇴사 처리: 접근만 막고(승인 해제) 그 사람의 일정·배정 기록은 그대로 둠 / 복귀: 다시 승인
    async setLeft(id, left) { ok(await sb.from('profiles').update(left ? { approved: false, is_admin: false, left_at: new Date().toISOString() } : { approved: true, left_at: null }).eq('id', id)); },
    async categories() { return ok(await sb.from('categories').select('id,label,color,shared,active,sort').order('sort')); },
    async saveCategory(c) {
      const row = { label: c.label, color: c.color, shared: c.shared, active: c.active, sort: c.sort };
      const d = c.id ? ok(await sb.from('categories').update(row).eq('id', c.id).select('id')) : ok(await sb.from('categories').insert(row).select('id'));
      if (!d || !d.length) throw new Error('permission denied');
    },
    async deleteCategory(id) { const d = ok(await sb.from('categories').delete().eq('id', id).select('id')); if (!d.length) throw new Error('permission denied'); },
    async events(from, to) { return norm(ok(await sb.from('events').select(cols).is('deleted_at', null).lte('start_date', to).gte('end_date', from).order('start_date').limit(1000))); },
    async myEvents(uid, from) {
      // 내가 직접 넣은 일정 + 관리자가 나를 배정한 일정
      const [ownRes, idRes] = await Promise.all([
        sb.from('events').select(cols).eq('owner_id', uid).is('deleted_at', null).gte('end_date', from).order('start_date').limit(300),
        sb.from('events').select('id,event_members!inner(user_id)').eq('event_members.user_id', uid).is('deleted_at', null).gte('end_date', from).order('start_date').limit(150)]);
      const own = norm(ok(ownRes)), ids = ok(idRes).map(r => r.id);
      const asg = ids.length ? norm(ok(await sb.from('events').select(cols).in('id', ids))) : [];
      const all = new Map([...own, ...asg].map(e => [e.id, e]));
      return [...all.values()].filter(e => (e.members.length ? e.members : [e.owner_id]).includes(uid)).sort((a, b) => a.start_date < b.start_date ? -1 : a.start_date > b.start_date ? 1 : 0);
    },
    async save(ev) {
      const row = { type: ev.type, title: ev.title, start_date: ev.start_date, end_date: ev.end_date, memo: ev.memo, client_id: ev.client_id || null };
      const data = ev.id ? ok(await sb.from('events').update(row).eq('id', ev.id).select('id'))
                         : ok(await sb.from('events').insert({ ...row, owner_id: ev.owner_id }).select('id'));
      if (!data || !data.length) throw new Error('permission denied');
      return data[0].id;
    },
    async setMembers(id, add, del, roles = {}, changed = [], spans = {}) {   // changed: 계속 배정돼 있으면서 역할이나 투입 기간이 바뀐 사람
      const sp = u => ({ start_date: (spans[u] || [])[0] || null, end_date: (spans[u] || [])[1] || null });
      if (del.length) ok(await sb.from('event_members').delete().eq('event_id', id).in('user_id', del));
      if (add.length) ok(await sb.from('event_members').insert(add.map(u => ({ event_id: id, user_id: u, role: roles[u] || null, ...sp(u) }))));
      for (const u of changed) ok(await sb.from('event_members').update({ role: roles[u] || null, ...sp(u) }).eq('event_id', id).eq('user_id', u));
    },
    async notify(id, users, kind) { const { data, error } = await sb.functions.invoke('notify', { body: { event_id: id, user_ids: users, kind } }); if (error) throw error; return data; },
    async registerPush(endpoint, p256dh, auth) { ok(await sb.rpc('register_push', { p_endpoint: endpoint, p_p256dh: p256dh, p_auth: auth })); },
    async unregisterPush(endpoint) { ok(await sb.rpc('unregister_push', { p_endpoint: endpoint })); },
    // 삭제 = 휴지통으로 보내기 (30일 보관). 관리자가 [설정]의 휴지통에서 복구
    async remove(id) { const r = await sb.rpc('trash_event', { p_id: id }); if (r.error) throw r.error; },
    async trash() { await sb.rpc('purge_trash'); return norm(ok(await sb.from('events').select(cols + ',deleted_at').not('deleted_at', 'is', null).order('deleted_at', { ascending: false }).limit(200))); },
    async restore(id) { const r = await sb.rpc('restore_event', { p_id: id }); if (r.error) throw r.error; },
    async setApproved(id, v) { ok(await sb.from('profiles').update({ approved: v }).eq('id', id)); },
    async setAdmin(id, v) { ok(await sb.from('profiles').update({ is_admin: v }).eq('id', id)); },
    async saveProfile(id, p) { ok(await sb.from('profiles').update({ name: p.name, title: p.title }).eq('id', id)); },
  };
}

    db.events.forEach(e => { const k = db.clients.find(c => e.title.startsWith(c.name)); if (k) e.client_id = k.id; });
  }
  db.clients = db.clients || [];
  db.events.forEach(e => { e.members = e.members || []; e.roles = e.roles || {}; });
  db.categories = db.categories || JSON.parse(JSON.stringify(DEFAULT_CATS));
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* 무시 */ } };
  const cp = x => JSON.parse(JSON.stringify(x));
  return {
    async session() { return { id: 'me' }; },
    async signIn() {}, async signUp() { return true; }, async resetRequest() {}, async setPassword() {}, async signOut() { try { localStorage.removeItem(KEY); } catch (e) {} },
    async profiles() { return cp(db.profiles); },
    async hideLeaver(id) { db.profiles.find(p => p.id === id).hidden = true; persist(); },
    async linkMember(from, to) {
      const f = db.profiles.find(p => p.id === from), t = db.profiles.find(p => p.id === to);
      for (const e of db.events) { if (e.owner_id === from) e.owner_id = to; if (e.members.includes(from)) { e.members = [...new Set(e.members.map(u => u === from ? to : u))]; if (e.roles && e.roles[from]) { e.roles[to] = e.roles[to] || e.roles[from]; delete e.roles[from]; } } }
      Object.assign(t, { approved: true, left_at: null, sort: f.sort }); db.profiles = db.profiles.filter(p => p.id !== from); persist();
    },
    async setOrder(list) { for (const [id, sort] of list) db.profiles.find(p => p.id === id).sort = sort; persist(); },
    async clients() { return cp(db.clients); },
    async saveClient(c) {
      if (db.clients.some(x => x.id !== c.id && x.name.toLowerCase() === c.name.toLowerCase())) throw new Error('duplicate key');
      if (c.id) Object.assign(db.clients.find(x => x.id === c.id), c); else db.clients.push({ ...c, id: 'k' + Date.now() }); persist();
    },
    async deleteClient(id) { if (db.events.some(e => e.client_id === id)) throw new Error('violates foreign key constraint'); db.clients = db.clients.filter(c => c.id !== id); persist(); },
    async clientEvents(id) { return cp(db.events.filter(e => e.client_id === id && !e.deleted_at).sort((a, b) => a.start_date < b.start_date ? 1 : -1)); },
    async setLeft(id, left) { const q = db.profiles.find(x => x.id === id); if (left) Object.assign(q, { approved: false, is_admin: false, left_at: new Date().toISOString() }); else Object.assign(q, { approved: true, left_at: null }); persist(); },
    async categories() { return cp(db.categories); },
    async saveCategory(c) { if (c.id) Object.assign(db.categories.find(x => x.id === c.id), c); else db.categories.push({ ...c, id: 'c' + Date.now() }); persist(); },
    async deleteCategory(id) { if (db.events.some(e => e.type === id)) throw new Error('violates foreign key constraint'); db.categories = db.categories.filter(c => c.id !== id); persist(); },
    async events(from, to) { return cp(db.events.filter(e => !e.deleted_at && e.start_date <= to && e.end_date >= from)); },
    async myEvents(uid, from) { return cp(db.events.filter(e => !e.deleted_at && (e.members.length ? e.members : [e.owner_id]).includes(uid) && e.end_date >= from).sort((a, b) => a.start_date < b.start_date ? -1 : 1)); },
    async save(ev) {
      const { owner_id, ...rest } = ev;
      if (ev.id) Object.assign(db.events.find(e => e.id === ev.id), rest);
      else { ev = { ...ev, id: 'e' + Date.now(), members: [], roles: {} }; db.events.push(ev); }
      persist(); return ev.id;
    },
    async setMembers(id, add, del, roles = {}, changed = [], spans = {}) {
      const e = db.events.find(x => x.id === id); e.members = e.members.filter(u => !del.includes(u)).concat(add);
      const fresh = u => add.includes(u) || changed.includes(u);
      e.roles = Object.fromEntries(e.members.map(u => [u, fresh(u) ? roles[u] : (e.roles || {})[u]]).filter(([, r]) => r));
      e.spans = Object.fromEntries(e.members.map(u => [u, fresh(u) ? spans[u] : (e.spans || {})[u]]).filter(([, r]) => r && (r[0] || r[1]))); persist();
    },
    async notify(id, users) { return { sent: 0, failed: 0, devices: 0, demo: users.length }; },
    async registerPush() {}, async unregisterPush() {},
    async remove(id) { db.events.find(e => e.id === id).deleted_at = new Date().toISOString(); persist(); },
    async trash() { const lim = new Date(Date.now() - 30 * 864e5).toISOString(); db.events = db.events.filter(e => !e.deleted_at || e.deleted_at > lim); persist(); return cp(db.events.filter(e => e.deleted_at).sort((a, b) => a.deleted_at < b.deleted_at ? 1 : -1)); },
    async restore(id) { delete db.events.find(e => e.id === id).deleted_at; persist(); },
    async setApproved(id, v) { db.profiles.find(p => p.id === id).approved = v; persist(); },
    async setAdmin(id, v) { db.profiles.find(p => p.id === id).is_admin = v; persist(); },
    async saveProfile(id, p) { Object.assign(db.profiles.find(x => x.id === id), p); persist(); },
  };
}

const spanOf = (e, uid) => { const sp = (e.spans || {})[uid]; if (!sp) return [e.start_date, e.end_date]; const a = sp[0] && sp[0] > e.start_date ? sp[0] : e.start_date, b = sp[1] && sp[1] < e.end_date ? sp[1] : e.end_date; return a <= b ? [a, b] : [e.start_date, e.end_date]; };

   스타일의 어두운 화면 규칙은 모두 @media (prefers-color-scheme:dark) 로 쓰여 있음.
   '밝게'·'어둡게'를 고르면 그 조건을 항상 거짓/항상 참으로 바꿔 끼워서 폰 설정과 상관없이 고정함. */
const THEME_KEY = 'sched84-theme', themeRules = [];

  const mode = LS.get(THEME_KEY) || 'auto';
  if (!themeRules.length) for (const sheet of document.styleSheets) { let rules; try { rules = sheet.cssRules; } catch (e) { continue; } for (const r of rules) if (r.media && /prefers-color-scheme:\s*dark/.test(r.media.mediaText)) themeRules.push(r); }
  for (const r of themeRules) r.media.mediaText = mode === 'dark' ? 'all' : mode === 'light' ? 'not all' : '(prefers-color-scheme: dark)';
  const dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';   // 날짜 선택기·스크롤바 같은 기본 부품도 같은 모드로

function exportCard() {

  for (let i = -2; i <= 4; i++) { const k = y0 * 4 + (q0 - 1) + i, y = Math.floor(k / 4), q = k % 4 + 1; opts.push([`${y}-${q}`, `${y}년 ${q * 3 - 2}~${q * 3}월${i === 0 ? ' (이번 분기)' : ''}`]); }

  const sel = h('select', { class: 'inp', 'aria-label': '내려받을 기간' }, opts.map(([v, l]) => h('option', { value: v, selected: v === `${y0}-${q0}` }, l)));
  const btn = h('button', { class: 'btn', id: 'xlbtn', onclick: async () => {
    const [y, q] = sel.value.split('-'), quarters = q === 'all' ? [1, 2, 3, 4].map(n => [+y, n]) : [[+y, +q]];
    btn.disabled = true; btn.textContent = '만드는 중…';
    try {
      const a = `${quarters[0][0]}-${pad(quarters[0][1] * 3 - 2)}-01`, last = quarters[quarters.length - 1], b = ymd(new Date(last[0], last[1] * 3, 0));
      const blob = XL.build(quarters, await store.events(a, b)), yy = String(y).slice(2);
      const name = `${DEPT} 일정표_${q === 'all' ? yy + '년' : `${yy}.${q * 3 - 2}~${q * 3}월`}_${today().slice(2).replace(/-/g, '')}.xlsx`;

    } catch (e) { toast(errText(e)); }

}

// 새 버전 확인: 앱을 켜 둔 채로 두어도 다음에 화면을 볼 때 최신으로 바뀌게 함

  if (DEMO || S.sheet) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;

  } catch (e) { /* 오프라인 등은 무시 */ }
