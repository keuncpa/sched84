<html lang="ko">
<head>

<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#16181d; --sub:#6b7280; --line:#e3e5ea; --brand:#1e3a8a; --brand-fg:#fff;
  --field-bg:#dbe7ff; --field-fg:#1d3fae; --leave-bg:#d8f3df; --leave-fg:#12692f;
  --deadline-bg:#ffdcdc; --deadline-fg:#b01919; --dept-bg:#eadcff; --dept-fg:#5b21b6;
  --sun:#d92c2c; --sat:#2456d6; --sel:#eef2ff;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115; --card:#1a1d24; --text:#eceef2; --sub:#9aa1ad; --line:#2b2f39; --brand:#16234d; --brand-fg:#fff;
  --field-bg:#1c2f66; --field-fg:#c3d4ff; --leave-bg:#143d22; --leave-fg:#b4ecc4;
  --deadline-bg:#551a1a; --deadline-fg:#ffc4c4; --dept-bg:#3a2466; --dept-fg:#dccbff;
  --sun:#ff7a7a; --sat:#8fb0ff; --sel:#232a40;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-fg);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.hrow{display:flex;align-items:center;gap:8px}
.hrow h1{font-size:17px;margin:0;flex:1;font-weight:700}
.nav{display:flex;align-items:center;gap:4px;margin-top:8px}
.nav .label{flex:1;font-size:19px;font-weight:700}
.nav button{color:inherit;min-width:40px;height:36px;border-radius:8px;background:rgba(255,255,255,.14);font-size:15px;padding:0 10px}
.demo{background:#fde68a;color:#5b4300;font-size:12.5px;padding:6px 14px;text-align:center}
main{flex:1;padding:10px 10px 96px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--sub)}
.fchip.on{color:var(--text);border-color:var(--text);font-weight:600}
.fchip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:hidden}
.dow{font-size:12px;text-align:center;padding:6px 0;color:var(--sub);border-bottom:1px solid var(--line)}
.cell{min-height:78px;padding:3px 2px 4px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;min-width:0;overflow:hidden}
.cell:nth-child(7n){border-right:0}
.cell.out .num{opacity:.35}
.cell.sel{background:var(--sel)}
.num{align-self:flex-start;display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;font-size:12.5px;border-radius:11px;margin-bottom:1px}
.today .num{background:var(--brand);color:#fff;font-weight:700}
.sun{color:var(--sun)} .sat{color:var(--sat)}
.chip{display:block;font-size:10.5px;line-height:1.35;border-radius:4px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.more{font-size:10.5px;color:var(--sub);padding-left:3px;margin-top:1px;display:block}
.t-field{background:var(--field-bg);color:var(--field-fg)} .t-leave{background:var(--leave-bg);color:var(--leave-fg)}
.t-deadline{background:var(--deadline-bg);color:var(--deadline-fg)} .t-dept{background:var(--dept-bg);color:var(--dept-fg)}
h2{font-size:15px;margin:16px 4px 8px}
.list{overflow:hidden}
.item{display:flex;gap:10px;align-items:stretch;width:100%;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .bar{width:5px;border-radius:3px;flex:none}
.item .tt{font-weight:600;word-break:break-all}
.item .ss{font-size:12.5px;color:var(--sub)}
.empty{padding:22px 12px;text-align:center;color:var(--sub);font-size:13.5px}
.twrap{overflow-x:auto}
table.team{border-collapse:collapse;width:100%;min-width:600px;table-layout:fixed}
.team th.sat,.team th.sun{width:48px}
.team th,.team td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px;vertical-align:top;font-size:12px}

.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(env(safe-area-inset-bottom) + 72px);z-index:6;width:54px;height:54px;border-radius:27px;background:var(--brand);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:760px;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto}
.sheet h3{margin:0 0 12px;font-size:17px}
.ov.mid{align-items:center;padding:16px}

label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 11px;font-size:16px;min-height:44px}
textarea{min-height:72px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);border-radius:9px;padding:9px 2px;font-size:13px}
.seg button.on{border-color:transparent;font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;border-radius:10px;padding:12px;font-weight:700;background:var(--brand);color:#fff;text-align:center}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.danger{background:none;border:1px solid var(--deadline-fg);color:var(--deadline-fg);flex:none;padding:12px 16px}
.btn.sm{flex:none;padding:6px 12px;font-size:13px}
.kv{font-size:14px;margin:6px 0}.kv span{color:var(--sub);display:inline-block;width:52px}
.memo{white-space:pre-wrap;word-break:break-all;background:var(--bg);border-radius:9px;padding:10px;font-size:14px;margin-top:8px}
.badge{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:600}
.auth{padding:40px 22px;max-width:420px;margin:0 auto;width:100%}
.auth h1{font-size:24px;margin:0 0 4px}.auth p{color:var(--sub);margin:0 0 18px}
.link{color:var(--sat);text-decoration:underline;font-size:14px;margin-top:16px;display:inline-block}
.pad{padding:12px 14px}
.help{font-size:13px;color:var(--sub);line-height:1.6}
.install{background:var(--sel);border-bottom:1px solid var(--line);padding:10px 12px 10px 14px;font-size:13.5px;line-height:1.5;display:flex;gap:10px;align-items:center}
.install>div{flex:1}.install .x{font-size:22px;color:var(--sub);padding:0 6px}.install .btn{margin-top:6px;display:inline-block}
.keep{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14.5px;color:var(--text)}.keep input{width:20px;height:20px;margin:0}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px}
.pick button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pick button.all{border-style:dashed;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);z-index:20;background:#111;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;max-width:86%;display:none}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="config.js" onerror="void 0"></script>
<script>
(() => {
'use strict';
const CFG = window.APP_CONFIG || {};
const DEMO = !(CFG.SUPABASE_URL && CFG.SUPABASE_KEY);
const APP_VERSION = '2026-11-26.3';   // 배포할 때마다 version.json 과 함께 올림 → 열려 있는 앱이 스스로 새로고침
const HASH0 = location.hash;   // 비밀번호 재설정 링크로 들어왔는지 판별용
const DEPT = CFG.DEPT_NAME || '84부';

/* ---------- 공통 도구 ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const md = s => { const d = parse(s); return `${d.getMonth() + 1}.${d.getDate()}(${DOW[d.getDay()]})`; };
const dayCount = (a, b) => Math.round((parse(b) - parse(a)) / 86400000) + 1;
const range = (a, b) => a === b ? md(a) : `${md(a)} – ${md(b)} · ${dayCount(a, b)}일`;
const mondayOf = s => { const d = parse(s); return addDays(s, -((d.getDay() + 6) % 7)); };

const TYPES = {
  field:    { label: '필드·감사', ph: '예: A사 기말감사' },
  leave:    { label: '휴가·교육', ph: '예: 연차', quick: ['연차', '오전 반차', '오후 반차', '교육', '기타 부재'] },
  deadline: { label: '마감·기한', ph: '예: A사 감사보고서 발행' },
  dept:     { label: '부서 행사', ph: '예: 부서 회의' },
};
const ORDER = ['dept', 'deadline', 'field', 'leave'];

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 3200);
}
function errText(e) {
  const m = (e && e.message) || String(e);
  if (/Invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 맞지 않습니다.';
  if (/already registered/i.test(m)) return '이미 가입된 이메일입니다. 로그인해 주세요.';
  if (/Email not confirmed/i.test(m)) return '가입 확인 메일의 링크를 먼저 눌러 주세요.';
  if (/Password should be/i.test(m)) return '비밀번호는 6자 이상으로 입력해 주세요.';
  if (/different from the old password/i.test(m)) return '이전과 다른 비밀번호를 입력해 주세요.';
  if (/not authorized/i.test(m)) return '메일 발송 설정이 아직 완료되지 않았습니다. 관리자에게 문의해 주세요.';
  if (/rate limit|security purposes/i.test(m)) return '요청이 너무 잦습니다. 1~2분 뒤 다시 시도해 주세요.';
  if (/row-level security|permission denied/i.test(m)) return '권한이 없습니다. (본인 일정만 수정할 수 있습니다)';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '네트워크 연결을 확인해 주세요.';
  return '오류: ' + m;
}

/* ---------- 로그인 상태 유지 선택 ---------- */
// 유지 선택 시: 기기에 계속 저장(localStorage) / 해제 시: 앱·탭을 닫으면 로그아웃(sessionStorage)
const REMEMBER_KEY = 'sched84-remember';
const box = pick => ({
  get: k => { try { return pick().getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { pick().setItem(k, v); } catch (e) { /* 무시 */ } },
  del: k => { try { pick().removeItem(k); } catch (e) { /* 무시 */ } },
});
const LS = box(() => localStorage), SS = box(() => sessionStorage);
const remembered = () => LS.get(REMEMBER_KEY) !== '0';
const setRemember = v => LS.set(REMEMBER_KEY, v ? '1' : '0');
const authStorage = {
  getItem: k => { const v = LS.get(k); return v != null ? v : SS.get(k); },
  setItem: (k, v) => { if (remembered()) { LS.set(k, v); SS.del(k); } else { SS.set(k, v); LS.del(k); } },
  removeItem: k => { LS.del(k); SS.del(k); },
};

/* ---------- 저장소: 실제 서버(Supabase) ---------- */
function supaStore(sb) {
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  const cols = 'id,owner_id,type,title,start_date,end_date,memo,event_members(user_id)';
  const norm = rows => rows.map(({ event_members, ...e }) => ({ ...e, members: (event_members || []).map(m => m.user_id) }));
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
    async signIn(email, password) { ok(await sb.auth.signInWithPassword({ email, password })); },
    async signUp(email, password, name) { const d = ok(await sb.auth.signUp({ email, password, options: { data: { name } } })); return !!d.session; },
    async signOut() { await sb.auth.signOut(); },
    async resetRequest(email) { ok(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname.replace(/index\.html$/, '') })); },
    async setPassword(pw) { ok(await sb.auth.updateUser({ password: pw })); },
    async profiles() { return ok(await sb.from('profiles').select('id,name,title,approved,is_admin').order('name')); },
    async events(from, to) { return norm(ok(await sb.from('events').select(cols).lte('start_date', to).gte('end_date', from).order('start_date').limit(1000))); },
    async myEvents(uid, from) {
      // 내가 직접 넣은 일정 + 관리자가 나를 배정한 일정
      const own = norm(ok(await sb.from('events').select(cols).eq('owner_id', uid).gte('end_date', from).order('start_date').limit(300)));
      const ids = ok(await sb.from('events').select('id,event_members!inner(user_id)').eq('event_members.user_id', uid).gte('end_date', from).order('start_date').limit(150)).map(r => r.id);
      const asg = ids.length ? norm(ok(await sb.from('events').select(cols).in('id', ids))) : [];
      const all = new Map([...own, ...asg].map(e => [e.id, e]));
      return [...all.values()].filter(e => (e.members.length ? e.members : [e.owner_id]).includes(uid)).sort((a, b) => a.start_date < b.start_date ? -1 : a.start_date > b.start_date ? 1 : 0);
    },
    async save(ev) {
      const row = { type: ev.type, title: ev.title, start_date: ev.start_date, end_date: ev.end_date, memo: ev.memo };
      const data = ev.id ? ok(await sb.from('events').update(row).eq('id', ev.id).select('id'))
                         : ok(await sb.from('events').insert({ ...row, owner_id: ev.owner_id }).select('id'));
      if (!data || !data.length) throw new Error('permission denied');
      return data[0].id;
    },
    async setMembers(id, add, del) {
      if (del.length) ok(await sb.from('event_members').delete().eq('event_id', id).in('user_id', del));
      if (add.length) ok(await sb.from('event_members').insert(add.map(u => ({ event_id: id, user_id: u }))));
    },
    async notify(id, users, kind) { const { data, error } = await sb.functions.invoke('notify', { body: { event_id: id, user_ids: users, kind } }); if (error) throw error; return data; },
    async registerPush(endpoint, p256dh, auth) { ok(await sb.rpc('register_push', { p_endpoint: endpoint, p_p256dh: p256dh, p_auth: auth })); },
    async unregisterPush(endpoint) { ok(await sb.rpc('unregister_push', { p_endpoint: endpoint })); },
    async remove(id) { const d = ok(await sb.from('events').delete().eq('id', id).select('id')); if (!d.length) throw new Error('permission denied'); },
    async setApproved(id, v) { ok(await sb.from('profiles').update({ approved: v }).eq('id', id)); },
    async setAdmin(id, v) { ok(await sb.from('profiles').update({ is_admin: v }).eq('id', id)); },
    async saveProfile(id, p) { ok(await sb.from('profiles').update({ name: p.name, title: p.title }).eq('id', id)); },
  };
}

/* ---------- 저장소: 데모(서버 연결 전 미리보기) ---------- */
function demoStore() {
  const KEY = 'sched84-demo';
  const t = today(), mon = mondayOf(t);
  let db = null;
  try { db = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { /* 저장소를 못 쓰는 환경 */ }
  if (!db) {
    const P = (id, name, title, approved = true, is_admin = false) => ({ id, name, title, approved, is_admin });
    const E = (id, owner_id, type, title, a, b, memo = '', members = []) => ({ id, owner_id, type, title, start_date: addDays(mon, a), end_date: addDays(mon, b), memo, members });
    db = {
      profiles: [P('me', '나(데모)', '수습', true, true), P('p2', '김회계', '매니저'), P('p3', '이감사', '시니어'), P('p4', '박결산', '시니어'), P('p5', '최신입', '수습', false)],
      events: [
        E('e1', 'p2', 'field', 'A사 중간감사', 0, 2, '현장 09:30 집합', ['me', 'p2', 'p4']), E('e3', 'p3', 'field', 'B사 내부회계 검토', 1, 4),
        E('e4', 'p4', 'leave', '연차', 3, 4), E('e5', 'me', 'leave', '교육', 4, 4, '집합교육'), E('e6', 'p2', 'deadline', 'C사 검토보고서 발행', 4, 4),
        E('e7', 'p2', 'dept', '부서 회의', 0, 0, '16:00 회의실'), E('e8', 'p3', 'field', 'D사 재고실사', 7, 8), E('e9', 'me', 'field', 'B사 중간감사', 7, 11),
        E('e10', 'me', 'field', 'E사 중간감사', 8, 11, '', ['p3', 'p4']), E('e11', 'p2', 'dept', '부서 송년회', 10, 10), E('e12', 'me', 'deadline', 'A사 조서 정리 마감', 9, 9),
      ],
    };
  }

  const colors = { field: 'var(--field-fg)', leave: 'var(--leave-fg)', deadline: 'var(--deadline-fg)', dept: 'var(--dept-fg)' };
  const redraw = () => ({ cal: viewCal, team: viewTeam })[S.view]();
  return h('div', { class: 'filters' },
    h('button', { class: 'fchip' + (S.onlyMine ? ' on' : ''), onclick: () => { S.onlyMine = !S.onlyMine; redraw(); } }, '내 일정만'),
    ORDER.map(t => h('button', { class: 'fchip' + (S.filter.has(t) ? ' on' : ''), onclick: () => { S.filter.has(t) ? S.filter.delete(t) : S.filter.add(t); redraw(); } },
      h('i', { style: 'background:' + colors[t] }), TYPES[t].label)));
}
const chipText = e => { if (e.type === 'dept') return e.title; const p = whoOf(e); return `${nameOf(p.includes(S.user.id) ? S.user.id : p[0])}${p.length > 1 ? '+' + (p.length - 1) : ''} ${e.title}`; };
function eventItem(e, showWho = true, back = null) {
  return h('button', { class: 'item', onclick: () => openDetail(e, back) },
    h('span', { class: 'bar t-' + e.type }),
    h('span', {}, h('div', { class: 'tt' }, e.title),
      h('div', { class: 'ss' }, [showWho && names(e), TYPES[e.type].label + (e.members && e.members.length ? ' · 배정' : ''), range(e.start_date, e.end_date)].filter(Boolean).join(' · '))));
}

/* ---------- 달력 ---------- */
function viewCal() {
  const [start, , rows] = monthSpan(), t = today(), mon = S.month.slice(0, 7);
  const grid = h('div', { class: 'grid card' }, DOW.map((d, i) => h('div', { class: 'dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') }, d)));
  for (let i = 0; i < rows * 7; i++) {
    const d = addDays(start, i), evs = onDay(d), dw = i % 7, max = 3;
    grid.append(h('button', { class: 'cell' + (d.slice(0, 7) !== mon ? ' out' : '') + (d === t ? ' today' : '') + (d === S.sel ? ' sel' : ''), onclick: () => { S.sel = d; viewCal(); openDay(d); } },
      h('span', { class: 'num' + (dw === 0 ? ' sun' : dw === 6 ? ' sat' : '') }, parse(d).getDate()),
      evs.slice(0, evs.length > max ? max - 1 : max).map(e => h('span', { class: 'chip t-' + e.type }, chipText(e))),
      evs.length > max && h('span', { class: 'more' }, `+${evs.length - (max - 1)}`)));
  }
  const evs = onDay(S.sel);
  elMain.replaceChildren(filterBar(), grid, h('h2', {}, `${md(S.sel)} 일정`),
    h('div', { class: 'card list' }, evs.length ? evs.map(e => eventItem(e)) : h('div', { class: 'empty' }, '등록된 일정이 없습니다.')));
}

/* ---------- 팀 보기(주간) ---------- */
function viewTeam() {
  const days = Array.from({ length: 7 }, (_, i) => addDays(S.week, i)), t = today();
  const people = S.profiles.filter(p => p.approved).sort((a, b) => (b.id === S.user.id) - (a.id === S.user.id) || a.name.localeCompare(b.name, 'ko'));
  const cellChips = list => list.map(e => h('button', { class: 'chip t-' + e.type, onclick: ev => { ev.stopPropagation(); openDetail(e); } }, e.title));
  const head = h('tr', {}, h('th', { class: 'who' }, ''), days.map(d => { const w = parse(d).getDay(); return h('th', { class: (d === t ? 'tod ' : '') + (w === 0 ? 'sun' : w === 6 ? 'sat' : '') }, `${DOW[w]} ${parse(d).getDate()}`); }));
  const deptRow = h('tr', {}, h('td', { class: 'who' }, '부서 공통'), days.map(d => h('td', { class: d === t ? 'tod' : '' }, cellChips(onDay(d).filter(e => e.type === 'dept')))));
  const rowsEl = people.map(p => h('tr', {}, h('td', { class: 'who' }, p.name, p.title && h('small', {}, p.title)),
    days.map(d => { const mine = p.id === S.user.id; return h('td', { class: (d === t ? 'tod ' : '') + (mine ? 'mine' : ''), onclick: mine ? () => openForm({ start_date: d }) : null },
      cellChips(onDay(d).filter(e => e.type !== 'dept' && whoOf(e).includes(p.id)))); })));
  elMain.replaceChildren(filterBar(), h('div', { class: 'card twrap' }, h('table', { class: 'team' }, h('thead', {}, head), h('tbody', {}, deptRow, rowsEl))),
    h('p', { class: 'help pad' }, '내 줄의 빈 칸을 누르면 그 날짜로 일정을 추가합니다. 표는 좌우로 밀어서 볼 수 있습니다.'));
}

/* ---------- 내 일정 ---------- */
function viewMine() {
  elMain.replaceChildren(h('h2', {}, '내 일정 (최근 1주 ~ 예정)'),
    h('div', { class: 'card list' }, S.mine.length ? S.mine.map(e => eventItem(e, false)) : h('div', { class: 'empty' }, '내 일정이 없습니다. 오른쪽 아래 + 버튼으로 추가하세요.')));
}

/* ---------- 설정 ---------- */
function viewSet() {
  const name = h('input', { type: 'text', maxlength: 30, value: S.me.name }), title = h('input', { type: 'text', maxlength: 20, value: S.me.title || '', placeholder: '예: 시니어' });
  const save = async () => { if (!name.value.trim()) return toast('이름을 입력해 주세요.'); try { await store.saveProfile(S.user.id, { name: name.value.trim(), title: title.value.trim() }); toast('저장했습니다.'); refresh(); } catch (e) { toast(errText(e)); } };
  const admins = S.profiles.filter(p => p.is_admin && p.approved).length;
  const act = async fn => { try { await fn(); await refresh(); } catch (e) { toast(errText(e)); } };
  const members = [...S.profiles].sort((a, b) => a.approved - b.approved || a.name.localeCompare(b.name, 'ko')).map(p => h('div', { class: 'item' },
    h('span', { style: 'flex:1' }, h('div', { class: 'tt' }, p.name, p.is_admin && h('span', { class: 'badge t-field' }, '관리자'), !p.approved && h('span', { class: 'badge t-deadline' }, '승인 대기')), h('div', { class: 'ss' }, p.title || '')),
    S.me.is_admin && h('span', { style: 'display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end' },
      p.approved && (p.id !== S.user.id || admins > 1) && h('button', { class: 'btn sm ghost', onclick: () => act(() => store.setAdmin(p.id, !p.is_admin)) }, p.is_admin ? '관리자 해제' : '관리자 지정'),
      p.id !== S.user.id && !p.is_admin && h('button', { class: 'btn sm' + (p.approved ? ' ghost' : ''), onclick: () => act(() => store.setApproved(p.id, !p.approved)) }, p.approved ? '승인 취소' : '승인'))));
  elMain.replaceChildren(...[
    h('h2', {}, '내 정보'), h('div', { class: 'card pad' }, h('div', { class: 'row2' }, h('div', {}, h('label', {}, '이름'), name), h('div', {}, h('label', {}, '직급'), title)), h('div', { class: 'btns' }, h('button', { class: 'btn', onclick: save }, '저장'))),
    h('h2', {}, `구성원 (${S.profiles.length}명)`), h('div', { class: 'card list' }, members),
    !DEMO && h('h2', {}, '배정 알림'), !DEMO && pushCard(),
    h('h2', {}, '폰 홈 화면에 앱으로 추가'), h('div', { class: 'card pad help' },
      h('div', {}, '아이폰: Safari로 접속 → 아래 공유 버튼 → "홈 화면에 추가"'), h('div', {}, '안드로이드: Chrome으로 접속 → 오른쪽 위 ⋮ 메뉴 → "홈 화면에 추가" 또는 "앱 설치"')),
    h('div', { class: 'btns', style: 'margin:18px 2px' }, h('button', { class: 'btn ghost', onclick: logout }, DEMO ? '데모 데이터 초기화' : '로그아웃'))].filter(Boolean));
}

/* ---------- 아래에서 올라오는 창 ---------- */
const sheet = (...kids) => sheetAt('', ...kids);
function sheetAt(cls, ...kids) {   // cls 'mid' = 화면 가운데에 띄움
  closeSheet(); S.sheet = true;
  const ov = h('div', { class: 'ov ' + cls, id: 'ov', onclick: e => { if (e.target === ov) closeSheet(); } }, h('div', { class: 'sheet' }, kids));
  document.body.append(ov);
}
function closeSheet() { const o = document.getElementById('ov'); if (o) o.remove(); S.sheet = false; }
// 달력에서 날짜를 누르면: 그날 일정을 화면 가운데에 펼침
function openDay(d) {
  const evs = onDay(d), back = () => openDay(d);
  sheetAt('mid', h('h3', {}, `${md(d)} 일정`),
    h('div', { class: 'card list' }, evs.length ? evs.map(e => eventItem(e, true, back)) : h('div', { class: 'empty' }, '등록된 일정이 없습니다.')),
    h('div', { class: 'btns' }, h('button', { class: 'btn ghost', onclick: closeSheet }, '닫기'), h('button', { class: 'btn', onclick: () => openForm({ start_date: d }) }, '+ 일정 추가')));
}
function openDetail(e, back = null) {
  let armed = false;
  const del = h('button', { class: 'btn danger', onclick: async () => {
    if (!armed) { armed = true; del.textContent = '정말 삭제'; return; }
    try { await store.remove(e.id); closeSheet(); toast('삭제했습니다.'); refresh(); } catch (er) { toast(errText(er)); }
  } }, '삭제');
  sheet(h('h3', {}, h('span', { class: 'badge t-' + e.type, style: 'margin:0 8px 0 0' }, TYPES[e.type].label), e.title),
    h('div', { class: 'kv' }, h('span', {}, e.members.length ? '참여' : '담당'), names(e, 99)), e.members.length > 0 && h('div', { class: 'kv' }, h('span', {}, '배정'), nameOf(e.owner_id) + ' (관리자)'),
    h('div', { class: 'kv' }, h('span', {}, '기간'), range(e.start_date, e.end_date)),
    e.memo && h('div', { class: 'memo' }, e.memo),
    h('div', { class: 'btns' }, canDelete(e) && del, canEdit(e) && h('button', { class: 'btn', onclick: () => openForm(e) }, '수정'), h('button', { class: 'btn ghost', onclick: back || closeSheet }, back ? '목록으로' : '닫기')),
    !canEdit(e) && h('p', { class: 'help' }, e.members.length ? '관리자가 배정한 일정입니다. 변경이 필요하면 관리자에게 요청해 주세요.' : '다른 사람의 일정은 보기만 할 수 있습니다.'));
}
function openForm(init) {
  const ev = { type: 'field', title: '', memo: '', members: [], ...init }; ev.end_date = ev.end_date || ev.start_date;
  const before = { title: ev.title, start_date: ev.start_date, end_date: ev.end_date, members: new Set(ev.members) };
  const title = h('input', { type: 'text', maxlength: 60, value: ev.title });
  const s = h('input', { type: 'date', value: ev.start_date, onchange: () => { if (e.value < s.value) e.value = s.value; } }), e = h('input', { type: 'date', value: ev.end_date });
  const memo = h('textarea', { maxlength: 500, placeholder: '집합 시간, 장소 등 (선택)' }); memo.value = ev.memo || '';
  const seg = h('div', { class: 'seg' }), quick = h('div', { class: 'quick' });
  const drawType = () => {
    seg.replaceChildren(...['field', 'leave', 'deadline', 'dept'].map(t => h('button', { type: 'button', class: ev.type === t ? 'on t-' + t : '', onclick: () => { ev.type = t; drawType(); } }, TYPES[t].label)));
    title.placeholder = TYPES[ev.type].ph;
    quick.replaceChildren(...(TYPES[ev.type].quick || []).map(q => h('button', { type: 'button', onclick: () => { title.value = q; } }, q)));
  };
  drawType();
  // 관리자 전용: 이 일정에 넣을 팀원 선택
  const sel = new Set(ev.members), pick = h('div', { class: 'pick' });
  const team = S.profiles.filter(p => p.approved).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  const drawPick = () => pick.replaceChildren(
    ...team.map(p => h('button', { type: 'button', class: sel.has(p.id) ? 'on' : '', 'aria-pressed': sel.has(p.id) ? 'true' : 'false', onclick: () => { sel.has(p.id) ? sel.delete(p.id) : sel.add(p.id); drawPick(); } }, p.name)),
    h('button', { type: 'button', class: 'all', onclick: () => { const all = sel.size === team.length; sel.clear(); if (!all) team.forEach(p => sel.add(p.id)); drawPick(); } }, sel.size === team.length ? '전체 해제' : '전체 선택'));
  drawPick();
  const btn = h('button', { class: 'btn', type: 'submit' }, '저장');
  sheet(h('h3', {}, ev.id ? '일정 수정' : '일정 추가'), h('form', { onsubmit: async x => {
    x.preventDefault();
    if (!title.value.trim()) return toast('제목을 입력해 주세요.');
    if (!s.value || !e.value) return toast('날짜를 입력해 주세요.');
    if (e.value < s.value) return toast('종료일이 시작일보다 빠릅니다.');
    btn.disabled = true;
    try {
      const id = await store.save({ id: ev.id, owner_id: S.user.id, type: ev.type, title: title.value.trim(), start_date: s.value, end_date: e.value, memo: memo.value.trim() });
      let jobs = [];
      if (S.me.is_admin) {
        const add = [...sel].filter(u => !before.members.has(u)), del = [...before.members].filter(u => !sel.has(u)), stay = [...sel].filter(u => before.members.has(u));
        if (add.length || del.length) await store.setMembers(id, add, del);
        const changed = ev.id && (before.title !== title.value.trim() || before.start_date !== s.value || before.end_date !== e.value);
        if (add.length) jobs.push(store.notify(id, add, 'assign'));
        if (changed && stay.length) jobs.push(store.notify(id, stay, 'update'));
      }
      closeSheet(); toast('저장했습니다.'); if (S.view === 'cal') S.sel = s.value; refresh();
      if (jobs.length) {   // 알림은 저장이 끝난 뒤 따로 보냄 (알림이 실패해도 일정은 저장된 상태)
        const rs = await Promise.all(jobs.map(j => j.then(r => r || {}, () => null)));
        if (rs.some(r => r === null)) toast('저장했습니다. 다만 알림 전송에는 실패했습니다.');
        else if (!DEMO) { const sent = rs.reduce((n, r) => n + (r.sent || 0), 0); toast(sent ? `저장했습니다. 알림 ${sent}건을 보냈습니다.` : '저장했습니다. (알림을 켠 팀원 기기가 없어 알림은 가지 않았습니다)'); }
      }
    } catch (er) { toast(errText(er)); btn.disabled = false; }
  } },
    h('label', {}, '유형'), seg, h('label', {}, '제목'), title, quick,
    h('div', { class: 'row2' }, h('div', {}, h('label', {}, '시작일'), s), h('div', {}, h('label', {}, '종료일'), e)),
    h('label', {}, '메모'), memo,
    S.me.is_admin && h('label', {}, '팀원 배정 (관리자) — 선택한 팀원의 일정표에 이 일정이 들어갑니다'), S.me.is_admin && pick,
    h('div', { class: 'btns' }, h('button', { class: 'btn ghost', type: 'button', onclick: closeSheet }, '취소'), btn)));
}

// 새 버전 확인: 앱을 켜 둔 채로 두어도 다음에 화면을 볼 때 최신으로 바뀌게 함
async function checkVersion() {
  if (DEMO || S.sheet) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const v = (await r.json()).v;
    if (v && v !== APP_VERSION && !location.search.includes('v=' + encodeURIComponent(v))) location.replace(location.pathname + '?v=' + encodeURIComponent(v));
  } catch (e) { /* 오프라인 등은 무시 */ }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });
setTimeout(checkVersion, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && S.me.approved && !S.sheet && S.view !== 'set') refresh(); });
if (!DEMO && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
})();
</script>
</body>
